version: '3.8'

services:
  # Official Messenger API (Recommended)
  messenger-api:
    build: .
    container_name: obibot-messenger-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
    command: npm start

  # Browser Automation (Legacy - only use if you don't have Professional Mode)
  # Uncomment to use browser automation instead
  # messenger-browser:
  #   build: .
  #   container_name: obibot-messenger-browser
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./config.json:/app/config.json:ro
  #   environment:
  #     - NODE_ENV=production
  #   command: npm run start:browser
  #   # Uncomment if you need to see the browser (requires X11 forwarding)
  #   # environment:
  #   #   - DISPLAY=${DISPLAY}
  #   # volumes:
  #   #   - /tmp/.X11-unix:/tmp/.X11-unix
